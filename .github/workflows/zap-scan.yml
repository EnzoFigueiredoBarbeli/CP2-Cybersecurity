name: OWASP ZAP Security Scan

on:
  push:
    branches: [ main, master ]

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start vulnerable web server
        run: |
          # Cria uma aplicação vulnerável simples em Python
          cat > app.py << 'EOF'
          from flask import Flask, request
          app = Flask(__name__)
          @app.route('/')
          def index():
              return '''<form method="GET" action="/vuln">
              <input name="q"><input type="submit">
              </form>'''
          @app.route('/vuln')
          def vuln():
              return f"Resultado: {request.args.get('q', '')}"
          if __name__ == '__main__':
              app.run(host='0.0.0.0', port=8080)
          EOF
          pip install flask
          python app.py &
          sleep 5
          curl http://localhost:8080 || echo "Falha ao iniciar"

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.9.0
        with:
          target: 'http://localhost:8080'
          cmd_options: '-a'  # automatiza alertas
          rules_file_name: '.zap/rules.tsv'  # opcional
          issue_title: 'ZAP report'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap_html_report
          path: report_html.html  # a action gera esse arquivo
