name: OWASP ZAP Security Scan

on:
  push:
    branches: [ main, master ]

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Start vulnerable web app
        run: |
          cat > app.py << 'EOF'
          from flask import Flask, request, render_template_string
          app = Flask(__name__)
          
          @app.route('/')
          def index():
              return '''
              <html>
              <body>
                  <h2>Login Vulnerável - Sem validação de entrada</h2>
                  <form method="POST" action="/login">
                      Usuário: <input name="user"><br>
                      Senha: <input name="pass"><br>
                      <input type="submit" value="Entrar">
                  </form>
                  <hr>
                  <h3>Busca vulnerável a XSS</h3>
                  <form method="GET" action="/busca">
                      Pesquisar: <input name="q"><input type="submit">
                  </form>
              </body>
              </html>
              '''
          
          @app.route('/login', methods=['POST'])
          def login():
              user = request.form.get('user', '')
              return f"Olá {user}, você acessou o sistema. <script>alert('XSS')</script>"
          
          @app.route('/busca')
          def busca():
              q = request.args.get('q', '')
              return f"Resultados para: {q}"
          
          if __name__ == '__main__':
              app.run(host='0.0.0.0', port=8080, debug=True)
          EOF
          pip install flask
          python app.py &
          sleep 10
          curl http://localhost:8080 || echo "Falha ao iniciar"

      - name: ZAP Baseline Scan (Docker)
        run: |
          docker run --user root \
            -v ${{ github.workspace }}:/zap/wrk:rw \
            --network host \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8080 \
            -J zap_output.json \
            -r zap_report.html \
            -a || true

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Fail pipeline on High/Critical vulnerabilities
        run: |
          if [ ! -f zap_output.json ]; then
            echo "JSON report not found!"
            exit 1
          fi
          HIGH=$(jq '[.site[].alerts[] | select(.risk == "High")] | length' zap_output.json)
          CRIT=$(jq '[.site[].alerts[] | select(.risk == "Critical")] | length' zap_output.json)
          echo "High: $HIGH, Critical: $CRIT"
          if [ "$HIGH" -gt 0 ] || [ "$CRIT" -gt 0 ]; then
            echo "Vulnerabilidades altas/críticas encontradas. Pipeline falhou."
            exit 1
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            zap_report.html
            zap_output.json
