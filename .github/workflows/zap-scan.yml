name: OWASP ZAP Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  zap-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install OWASP ZAP
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget https://github.com/zaproxy/zaproxy/releases/download/v2.14.0/ZAP_2.14.0_Linux.tar.gz
          tar -xzvf ZAP_2.14.0_Linux.tar.gz
          sudo mv ZAP_2.14.0 /opt/zap

      - name: Start vulnerable web app (Flask)
        run: |
          pip install flask
          python -c "
          from flask import Flask, request
          app = Flask(__name__)
          @app.route('/')
          def index():
              return '<form method=\"POST\" action=\"/login\"><input name=\"user\"><input type=\"submit\"></form>'
          @app.route('/login', methods=['POST'])
          def login():
              return f\"Olá {request.form['user']}\"
          app.run(host='0.0.0.0', port=8080)
          " &
          sleep 5

      - name: Run ZAP baseline scan (gerar JSON e HTML)
        run: |
          /opt/zap/zap.sh -cmd -quickurl http://localhost:8080 -quickout ./zap_output.json

      - name: Install jq for JSON parsing
        run: sudo apt-get install -y jq

      - name: Fail pipeline if High or Critical vulnerabilities found
        run: |
          HIGH_COUNT=$(jq '[.site[].alerts[] | select(.risk == "High")] | length' zap_output.json)
          CRIT_COUNT=$(jq '[.site[].alerts[] | select(.risk == "Critical")] | length' zap_output.json)
          echo "High alerts: $HIGH_COUNT"
          echo "Critical alerts: $CRIT_COUNT"
          if [ "$HIGH_COUNT" -gt 0 ] || [ "$CRIT_COUNT" -gt 0 ]; then
            echo "❌ Vulnerabilidades altas ou críticas encontradas. Bloqueando deploy."
            exit 1
          fi

      - name: Convert JSON to HTML report (opcional)
        run: |
          # Cria um HTML mínimo para artefato
          echo "<html><body><pre>$(cat zap_output.json | jq .)</pre></body></html>" > zap_report.html

      - name: Upload ZAP report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-report
          path: |
            zap_output.json
            zap_report.html
        if: always()
